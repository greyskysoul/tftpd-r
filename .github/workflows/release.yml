name: Release

# A `v*` tag builds every supported target and publishes a GitHub Release.
# `workflow_dispatch` runs the same matrix but stops after uploading workflow
# artifacts, which is how the pipeline is tested without cutting a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate: no artifact is published unless format, lints and tests pass on both
  # native hosts (MSVC on Windows, GNU on Linux).
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install GUI build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev pkg-config
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  # Every target builds on a native runner of its own architecture, so no cross
  # toolchain or emulation is involved for the published binaries.
  build:
    name: build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install GUI build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev pkg-config
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cargo build --workspace --release --locked
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([0-9][^"]*\)"$/\1/p' Cargo.toml | head -n1)
          name="tftpd-r-${version}-${TARGET}"
          exe=""
          case "$TARGET" in
            *windows*) exe=".exe" ;;
          esac
          mkdir -p "dist/${name}"
          cp "target/release/tftpd-r${exe}" "dist/${name}/"
          cp "target/release/tftpd-r-gui${exe}" "dist/${name}/"
          if [ -n "$exe" ]; then
            # Both executables embed the product icon as a PE resource; the
            # .ico is also shipped for shortcuts/tools that want the file
            # (see crates/tftpd-r-gui-slint/ui/icons/README.md).
            cp "crates/tftpd-r-gui-slint/ui/icons/app-icon.ico" "dist/${name}/tftpd-r-gui.ico"
          fi
          cp config.example.toml README.md LICENSE-MIT LICENSE-APACHE "dist/${name}/"
          if [ -n "$exe" ]; then
            (cd dist && 7z a -tzip "../${name}.zip" "${name}" >/dev/null)
          else
            tar -czf "${name}.tar.gz" -C dist "${name}"
          fi
          ls -l "${name}".*
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            tftpd-r-*.zip
            tftpd-r-*.tar.gz
          if-no-files-found: error

  publish:
    name: publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes=".github/release-notes/${TAG#v}.md"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          elif [ -f "$notes" ]; then
            gh release create "$TAG" dist/* --repo "$REPO" \
              --title "TftpdR $TAG" --notes-file "$notes"
          else
            gh release create "$TAG" dist/* --repo "$REPO" \
              --title "TftpdR $TAG" --generate-notes
          fi

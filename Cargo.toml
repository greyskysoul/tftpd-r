[workspace]
resolver = "2"
members = [
    "crates/tftpd-r-build-support",
    "crates/tftpd-r-core",
    "crates/tftpd-r-daemon",
    "crates/tftpd-r-gui-slint",
]

[workspace.package]
authors = ["TftpdR contributors"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/greyskysoul/tftpd-r"
version = "0.4.0"

[workspace.dependencies]
tftpd-r-build-support = { path = "crates/tftpd-r-build-support" }
tftpd-r-core = { path = "crates/tftpd-r-core" }
chrono = "0.4.45"
# System locale for the startup language decision. Already a transitive
# dependency of Slint (used for bundled-translation selection), so this adds no
# crate to Cargo.lock; it is declared directly so the panel does not depend on
# Slint internals for the locale.
sys-locale = "0.3"
tokio = { version = "1.54", features = ["rt", "rt-multi-thread", "net", "time", "sync", "fs", "io-util", "macros", "signal"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
toml = "1.2"
tracing = "0.1"
# `env-filter` is deliberately not enabled: it pulls the `regex` engine (about
# 290 KiB of the stripped daemon on the GNU x64 build) for a filter syntax the
# daemon does not need. `tracing-log` is not enabled either; nothing in the
# daemon's dependency graph logs through the `log` crate, and `logging` parses
# the level-based directive subset itself. See
# docs/adr/0016-log-filter-without-env-filter.md.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
tempfile = "3.27"
slint = { version = "1.19", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "software-renderer-systemfonts",
    "compat-1-2",
    # Native notification-area icon (ADR 0018): Shell_NotifyIconW on Windows,
    # StatusNotifierItem/ksni on Linux and NSStatusItem on macOS. The generated
    # `SystemTrayIcon` element is part of the panel UI; without this feature it
    # would silently fall back to the dummy backend.
    "system-tray",
] }
slint-build = "1.19"

[workspace.lints.rust]
# `deny` rather than `forbid`: the Slint code generator emits `#[allow(unsafe_code)]`
# around its FFI shims, which is incompatible with `forbid`. Hand-written code in
# this workspace contains no `unsafe` and must not add any without review.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Size-first release profile for the two shipped binaries. On the verification
# toolchain (GNU x64) this cuts the GUI from ~12.8 MiB to ~8.3 MiB and the daemon
# from ~2.1 MiB to ~1.2 MiB. `panic = "abort"` is a deliberate fail-fast choice:
# a panic in a spawned task terminates the process instead of being contained by
# Tokio. See docs/adr/0010-size-first-release-profile.md.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
